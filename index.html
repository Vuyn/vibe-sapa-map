/* Layout: a game cartridge. Skyline strip under the title, viewport canvas with camera on the left, travel journal on the right; stacks on phones. */
/* Colours come from the map itself: forest green for the accent, terrace gold for marks, sage and deep green for the page. */
:root{
  --bg:#e7ecd8; --panel:#f5f7ea; --ink:#1f2a1c; --muted:#5d6b55; --line:#bcc7a4;
  --accent:#2e7d32; --accent-ink:#ffffff; --chip:#dde5c6; --focus:#1f5fbf; --ok:#8a6a12;
  --display:'Press Start 2P',monospace; --body:'IBM Plex Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121812; --panel:#1b231b; --ink:#e6eedc; --muted:#9aa88f; --line:#33402f;
  --accent:#6fbf73; --accent-ink:#0f1a10; --chip:#263226; --focus:#8fb8ff; --ok:#e3c35a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121812; --panel:#1b231b; --ink:#e6eedc; --muted:#9aa88f; --line:#33402f;
  --accent:#6fbf73; --accent-ink:#0f1a10; --chip:#263226; --focus:#8fb8ff; --ok:#e3c35a; color-scheme:dark }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
img{max-width:100%}[hidden]{display:none!important}
header{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-bottom:14px}
.titlerow{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 20px}
h1{font-family:var(--display);font-size:clamp(13px,2.2vw,20px);margin:0;line-height:1.5;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:0}
canvas#sky{display:block;width:100%;height:84px;image-rendering:pixelated;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--line);background:#1d2a1d}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}
.stage{position:relative;background:#1d2a1d;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--line);min-width:0;overflow:hidden;touch-action:none}
canvas#map{display:block;width:100%;height:auto;aspect-ratio:4/3;max-height:80vh;image-rendering:pixelated;cursor:grab}
canvas#map.drag{cursor:grabbing}
canvas#map:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.hud{position:absolute;left:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 60px)}
.btn{font-family:var(--display);font-size:8px;padding:7px 9px;background:var(--panel);color:var(--ink);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer;line-height:1;white-space:nowrap}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn:focus-visible,.list button:focus-visible,.zoom button:focus-visible,#hour:focus-visible,#month:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.zoom{position:absolute;right:10px;top:10px;display:grid;gap:4px}
.zoom button{width:34px;height:34px;background:var(--panel);color:var(--ink);border:2px solid var(--ink);font-family:var(--display);font-size:12px;cursor:pointer;padding:0;box-shadow:3px 3px 0 var(--ink)}
canvas#mini{position:absolute;left:8px;bottom:8px;width:128px;height:118px;border:2px solid var(--ink);image-rendering:pixelated;cursor:pointer;background:#1d2a1d}
.toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-family:var(--display);font-size:8px;padding:8px 12px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
.tip{position:absolute;pointer-events:none;background:rgba(27,24,18,.9);color:#f4f4f0;font-size:12px;padding:4px 8px;border:2px solid #f4f4f0;max-width:220px;display:none;z-index:4}
.intro{position:absolute;inset:0;background:rgba(27,24,18,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.intro div{background:var(--panel);color:var(--ink);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--accent);padding:18px;max-width:380px;font-size:14px}
.intro h2{font-family:var(--display);font-size:11px;margin:0 0 10px;line-height:1.6}
.intro p{margin:0 0 8px}
.intro .btn{margin-top:6px}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#f4f4f0;font-family:var(--display);font-size:9px;text-align:center;padding:16px;line-height:2}
.panel{background:var(--panel);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--line);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.topbar{display:grid;gap:8px}
.visited{font-family:var(--display);font-size:8px;color:var(--muted)}
.visited b{color:var(--ok)}
.card .kicker{font-family:var(--display);font-size:8px;color:var(--accent);letter-spacing:.5px;text-transform:uppercase;margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stamp{display:inline-block;border:2px solid var(--ok);color:var(--ok);padding:2px 5px;transform:rotate(-4deg)}
.card h2{font-family:var(--display);font-size:11px;line-height:1.6;margin:0 0 2px;text-wrap:balance}
.card .vi{color:var(--muted);font-size:13px;margin:0 0 8px;font-style:italic}
.eta{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px;padding:0;list-style:none}
.eta li{border:2px solid var(--accent);font-size:12px;padding:3px 8px;font-variant-numeric:tabular-nums}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px;padding:0;list-style:none}
.facts li{background:var(--chip);font-size:12px;padding:3px 8px;font-variant-numeric:tabular-nums}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 10px;padding:0;list-style:none}
.times li{border:2px solid var(--line);padding:5px 6px;font-size:12px;line-height:1.3}
.times li span{display:block;font-family:var(--display);font-size:7px;color:var(--muted);margin-bottom:3px}
.card p{margin:0 0 8px;font-size:14px}
.card .tipline{border-left:3px solid var(--accent);padding-left:8px;color:var(--muted);font-size:13px}
.card .src{font-size:11px;color:var(--muted);margin:0}
.card .sketch{display:block;width:100%;height:auto;aspect-ratio:2/1;image-rendering:pixelated;border:2px solid var(--line);margin:0 0 10px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.list{margin:0;padding:0;list-style:none;display:grid;gap:3px;max-height:260px;overflow:auto;border-top:2px dashed var(--line);padding-top:10px}
.list button{width:100%;text-align:left;background:none;border:2px solid transparent;padding:4px 6px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;display:flex;gap:8px;align-items:center}
.list button:hover{border-color:var(--line)}
.list button[aria-current="true"]{border-color:var(--accent)}
.list i{width:10px;height:10px;display:inline-block;flex:none}
.list em{margin-left:auto;font-style:normal;color:var(--ok);font-family:var(--display);font-size:8px}
.list small{color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12px;color:var(--muted);margin:0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:6px}
.legend b{width:12px;height:12px;display:inline-block;border:1px solid var(--ink);flex:none}
.legend b.dash{background:repeating-linear-gradient(90deg,#c2412b 0 3px,transparent 3px 6px);border:0;height:3px}
.help{font-size:12px;color:var(--muted);margin:0}
kbd{font-family:var(--display);font-size:8px;background:var(--chip);padding:2px 4px;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.row input{flex:1;min-width:0;accent-color:var(--accent)}
.row output{font-family:var(--display);font-size:8px;min-width:4ch;font-variant-numeric:tabular-nums}
.row .lbl{min-width:3.5em}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
/* --- decluttered layout: controls live in the side panel, status in one strip --- */
canvas#sky{height:48px}
.stage{overflow:visible;touch-action:auto}
.view{position:relative;overflow:hidden;touch-action:none}
canvas#mini{bottom:42px}
#miniBtn{position:absolute;left:8px;bottom:8px;width:28px;height:28px;background:var(--panel);color:var(--ink);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-family:var(--display);font-size:10px;cursor:pointer;padding:0}
#miniBtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#miniBtn:focus-visible,.tab:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:7px 10px;background:var(--ink);color:var(--bg);font-family:var(--display);font-size:8px;line-height:1.4;font-variant-numeric:tabular-nums}
.status .sp{margin-left:auto}
.status i{display:inline-block;width:8px;height:8px;margin-right:6px;vertical-align:middle}
.status i.sun{background:#f1c232}.status i.moon{background:#b9dcff}
.scale{display:inline-flex;align-items:center;gap:6px}
.scale b{display:inline-block;height:4px;background:var(--bg);border-left:2px solid var(--bg);border-right:2px solid var(--bg);box-sizing:content-box}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tab{flex:1 1 auto;font-family:var(--display);font-size:7px;padding:8px 6px;background:var(--chip);color:var(--ink);border:2px solid var(--ink);cursor:pointer;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.pane{display:flex;flex-direction:column;gap:12px;min-width:0}
.list{max-height:min(60vh,520px);border-top:0;padding-top:0}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
/* --- 2026-11-11 fixes: map-shaped canvas, overview in the panel, taller section strip, Vietnamese-safe type --- */
canvas#sky{height:64px}
canvas#map{aspect-ratio:840/472;max-height:none}
:root{--mapw:calc(76vh * 840 / 472 + 8px)}
@media (min-width:901px){.wrap{grid-template-columns:minmax(0,var(--mapw)) minmax(300px,440px);justify-content:center}header{max-width:calc(var(--mapw) + 16px + 440px);margin-inline:auto}}
canvas#mini{position:static;display:block;width:100%;height:auto;aspect-ratio:840/472;border:2px solid var(--ink);image-rendering:pixelated;cursor:pointer;background:#1d2a1d}
.zoom button svg{display:block;margin:auto}
#lang{font-family:var(--body);font-size:11px;font-weight:600}
.vi .btn,.vi .tab,.vi .visited,.vi .status,.vi .toast,.vi .loading,.vi .card .kicker,.vi .card h2,.vi .intro h2,.vi .times li span,.vi .row output{font-family:var(--body);font-weight:600;letter-spacing:0}
.vi .btn,.vi .tab,.vi .status,.vi .toast,.vi .card .kicker,.vi .visited,.vi .row output{font-size:11px}
.vi .times li span{font-size:10px}
.vi .card h2,.vi .intro h2{font-size:15px}
.eta li.sum{background:var(--accent);color:var(--accent-ink)}
/* --- phone: the map has the whole screen. The title and section strip are hidden, and the panel is a sheet that
   shows only its row of tabs until one is tapped. Canvases never set the page width. --- */
@media (max-width:900px){
  body{padding:0}
  header{margin:0;gap:0}
  .titlerow{display:none}
  canvas#sky{height:44px;border-width:0 0 2px;box-shadow:none}
  .wrap{display:block}
  .stage{border-width:0;box-shadow:none}
  canvas#map{aspect-ratio:auto;width:100%;height:calc(100vh - 78px);height:calc(100dvh - 78px)}
  .status{padding:5px 8px;gap:4px 10px;flex-wrap:nowrap;overflow:hidden;white-space:nowrap}
  .status>span:last-child,.status #stDay{display:none}
  .panel{position:fixed;left:0;right:0;bottom:0;z-index:8;max-height:74vh;max-height:74dvh;overflow:auto;border-width:3px 0 0;box-shadow:none;padding:6px 10px 12px;gap:10px;transform:translateY(calc(100% - 46px));transition:transform .2s ease}
  .panel.open{transform:none}
  .tabs{position:sticky;top:0;z-index:1;background:var(--panel);padding:2px 0 6px}
  .tab{padding:10px 4px}
}
@media (max-width:900px) and (prefers-reduced-motion:reduce){.panel{transition:none}}
</style>
</head>
<body>
<header>
  <div class="titlerow">
    <h1>SAPA · LÀO CAI · 1,500 m</h1>
    <p class="sub" id="subtitle"></p>
  </div>
  <canvas id="sky" width="512" height="84" aria-label="Mountain skyline from west to east with your position"></canvas>
</header>

<div class="wrap">
  <div class="stage" id="stage">
   <div class="view">
    <canvas id="map" tabindex="0" aria-label="Bản đồ pixel Sa Pa. Bấm vào một điểm để đi tới, kéo để dời, lăn chuột hoặc chụm ngón tay để phóng. Trên bàn phím: phím mũi tên dời bản đồ, Enter đi tới dấu chữ thập giữa màn hình."></canvas>
    <div class="zoom"><button id="zin" type="button" aria-label="Zoom in">+</button><button id="zout" type="button" aria-label="Zoom out">-</button><button id="zfit" type="button" aria-label="Fit whole map">□</button><button id="me" type="button" aria-label="Centre on me">◎</button><button id="gear" type="button" aria-label="Open settings">⚙</button></div>
    <div class="tip" id="tip"></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="loading" id="loading">ĐANG TẢI BẢN ĐỒ SA PA...</div>
    <div class="intro" id="intro" hidden><div>
      <h2 id="introTitle"></h2>
      <p id="introBody"></p>
      <button class="btn" id="introBtn" type="button"></button>
    </div></div>
   </div>
   <div class="status" id="status"><span><i id="stIcon" class="sun"></i><span id="stClock">09:00</span></span><span id="stDay">SAT</span><span id="stMonth">SEP</span><span id="stClim"></span><span id="stSky"></span><span id="stElev"></span><span class="scale sp"><b id="scaleBar" style="width:60px"></b><span id="scaleTxt">1 km</span></span><span>N ▲</span></div>
  </div>

  <aside class="panel" id="panel">
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-place" role="tab" aria-selected="true" aria-controls="pane-place" type="button">PLACE</button>
      <button class="tab" id="tab-list" role="tab" aria-selected="false" aria-controls="pane-list" type="button">PLACES</button>
      <button class="tab" id="tab-settings" role="tab" aria-selected="false" aria-controls="pane-settings" type="button">SETTINGS</button>
      <button class="tab" id="tab-about" role="tab" aria-selected="false" aria-controls="pane-about" type="button">LEGEND</button>
    </div>
    <section class="pane" id="pane-place" role="tabpanel" aria-labelledby="tab-place">
      <div class="card" id="card"></div>
      <div class="tools">
        <button class="btn" id="walk" type="button">WALK HERE</button>
        <button class="btn" id="home" type="button">BACK TO TOWN</button>
      </div>
    </section>
    <section class="pane" id="pane-list" role="tabpanel" aria-labelledby="tab-list" hidden>
      <span class="visited" id="visitedCount"></span>
      <ul class="list" id="list"></ul>
    </section>
    <section class="pane" id="pane-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
      <div class="row"><span class="lbl" id="timeLabel">Time</span><input type="range" id="hour" min="0" max="24" step="0.25" value="9" aria-label="Hour of day"><output id="hourOut">09:00</output><button class="btn" id="autoTime" aria-pressed="true" type="button">AUTO</button></div>
      <div class="row"><span class="lbl" id="monthLabel">Month</span><input type="range" id="month" min="1" max="12" step="1" value="9" aria-label="Month"><output id="monthOut">Sep</output></div>
      <div class="toggles">
        <button class="btn" id="weather" type="button">SKY: AUTO</button>
        <button class="btn" id="dayBtn" type="button">DAY: SAT</button>
        <button class="btn" id="labels" aria-pressed="true" type="button">LABELS</button>
        <button class="btn" id="routes" aria-pressed="true" type="button">TREKS</button>
        <button class="btn" id="shops" aria-pressed="false" type="button">SHOP NAMES</button>
        <button class="btn" id="skyToggle" aria-pressed="true" type="button">SKYLINE</button>
        <button class="btn" id="sound" aria-pressed="false" type="button">SOUND OFF</button>
        <button class="btn" id="lang" type="button">TIẾNG VIỆT</button>
      </div>
    </section>
    <section class="pane" id="pane-about" role="tabpanel" aria-labelledby="tab-about" hidden>
      <ul class="legend" id="legend"></ul>
      <p class="help" id="help"></p>
      <p class="help" id="credits"></p>
    </section>
    <canvas id="mini" width="840" height="472" aria-label="Overview map. Click to jump there."></canvas>
  </aside>
</div>

 {id:'sunplaza',en:'Sun Plaza & Mountain Train',vi:'Sun Plaza & Ga tàu hỏa leo núi',lat:22.33426,lon:103.84037,sp:'sunplaza',big:1,src:'osm',walk:'4 min',bike:'1 min',guide:0,
  f:{en:['Built 2018','Funicular 2 km','6 min to cable car'],vi:['Xây 2018','Tàu leo núi 2 km','6 phút tới cáp treo']},
  d:{en:'A building in French railway-station style on the square. The Mường Hoa mountain train leaves from inside and glides 2 km down the valley side to the cable car base.',vi:'Tòa nhà kiểu ga xe lửa Pháp bên quảng trường. Tàu hỏa leo núi Mường Hoa xuất phát từ đây, chạy 2 km xuống ga cáp treo.'},
  t:{en:'Buy the combined train and cable car ticket here to skip the taxi.',vi:'Mua vé gộp tàu và cáp treo ở đây để khỏi đi taxi.'}},
 {id:'museum',en:'Sapa Museum',vi:'Bảo tàng Sa Pa',lat:22.33554,lon:103.84010,sp:'museum',src:'osm',walk:'5 min',bike:'1 min',guide:0,
  f:{en:['Free entry','Hill station history','Ethnic costume'],vi:['Miễn phí','Lịch sử thị xã','Trang phục dân tộc']},
  d:{en:'A small museum above the square with the story of the French hill station, old photographs and the costumes and tools of the five local peoples.',vi:'Bảo tàng nhỏ phía trên quảng trường kể chuyện thị trấn nghỉ mát thời Pháp, ảnh cũ và trang phục, nông cụ của năm dân tộc địa phương.'},
  t:{en:'Thirty minutes, and a good first stop when it rains.',vi:'Ba mươi phút, điểm dừng tốt khi trời mưa.'}},
 {id:'victoria',en:'Victoria Sapa Resort',vi:'Khách sạn Victoria Sa Pa',lat:22.33696,lon:103.84278,sp:'hotel',src:'osm',walk:'5 min',bike:'1 min',guide:0,
  f:{en:['Opened 1998','Colonial style','Victoria Express'],vi:['Mở 1998','Kiểu thuộc địa','Tàu Victoria Express']},
  d:{en:'The colonial-style resort on the hill above the lake, famous for its private sleeper carriage attached to the Hanoi night train.',vi:'Khu nghỉ kiểu thuộc địa trên đồi phía trên hồ, nổi tiếng với toa giường nằm riêng móc vào tàu đêm Hà Nội.'},
  t:{en:'Non-guests can use the heated pool and terrace for a fee.',vi:'Khách ngoài có thể dùng bể bơi nước nóng và sân thượng với một khoản phí.'}},
 {id:'lake',en:'Sapa Lake',vi:'Hồ Sa Pa',lat:22.33844,lon:103.84735,sp:'isle',src:'osm',walk:'6 min',bike:'2 min',guide:0,
  f:{en:['Town park','One small island','Evening walks'],vi:['Công viên','Một đảo nhỏ','Dạo tối']},
  d:{en:'A narrow lake ringed by a promenade, with one small wooded island near its eastern end. Cafés on the slope above look across the water to Hàm Rồng.',vi:'Hồ hẹp có đường dạo quanh, với một đảo nhỏ rợp cây gần đầu phía đông. Quán cà phê trên dốc nhìn qua mặt nước sang Hàm Rồng.'},
  t:{en:'Fog rolls in fast after 4 pm. The lake disappears in minutes.',vi:'Sau 4 giờ chiều sương xuống rất nhanh, hồ biến mất trong vài phút.'}},
 {id:'hamrong',en:'Ham Rong Mountain',vi:'Núi Hàm Rồng',lat:22.33363,lon:103.84680,sp:'hill',major:1,src:'osm',walk:'1.5 h loop',bike:'-',guide:0,
  f:{en:['Garden gate 1,600 m','Summit 1,908 m','Orchids, Cloud Yard'],vi:['Cổng vườn 1.600 m','Đỉnh 1.908 m','Vườn lan, Sân Mây']},
  d:{en:'"Dragon Jaw" rises straight out of town. Stone steps climb through orchid gardens and a rock maze to Cloud Yard; a longer trail continues east to the true summit.',vi:'Núi "hàm rồng" mọc thẳng từ thị xã. Bậc đá lên qua vườn lan và mê cung đá tới Sân Mây; lối mòn dài hơn đi tiếp về phía đông lên đỉnh thật.'},
  t:{en:'The gate is a 5-minute walk from the church. Cheapest big view in Sapa.',vi:'Cổng cách nhà thờ 5 phút đi bộ. Góc nhìn rẻ nhất Sa Pa.'}},
 {id:'monastery',en:'Truc Lam Zen Monastery',vi:'Thiền viện Trúc Lâm Đại Giác',lat:22.34074,lon:103.84942,sp:'pagoda',big:1,src:'osm',walk:'15 min',bike:'4 min',guide:0,
  f:{en:['Zen Buddhist','View over the lake'],vi:['Thiền tông','Nhìn xuống hồ']},
  d:{en:'A Zen monastery on the slope north of town, with a wide terrace that looks over the lake to Hàm Rồng.',vi:'Thiền viện trên sườn núi phía bắc thị xã, sân rộng nhìn qua hồ sang Hàm Rồng.'},
  t:{en:'Quiet at dawn, before the town wakes.',vi:'Yên tĩnh lúc bình minh, trước khi thị xã thức dậy.'}},
 {id:'market',en:'Sapa Market',vi:'Chợ Sa Pa',lat:22.33829,lon:103.85198,sp:'market',src:'osm',walk:'15 min',bike:'4 min',guide:0,
  f:{en:['Daily, busiest Sun','Brocade, herbs','Thắng cố'],vi:['Hằng ngày, đông CN','Thổ cẩm, thuốc nam','Thắng cố']},
  d:{en:'The covered market east of the lake: indigo hemp, embroidered Hmong jackets, Red Dao silver and a food court serving thắng cố, cơm lam and táo mèo wine.',vi:'Chợ có mái phía đông hồ: vải lanh nhuộm chàm, áo Mông thêu tay, bạc Dao đỏ và khu ẩm thực với thắng cố, cơm lam, rượu táo mèo.'},
  t:{en:'Sunday before 9 am is when the villages come to trade.',vi:'Sáng Chủ nhật trước 9h là lúc dân bản xuống chợ.'},
  eat:{en:'Dishes to try: thắng cố (horse stew), Sa Pa salmon or sturgeon hotpot, roast lợn cắp nách (small free-range pig), smoked buffalo, cơm lam (sticky rice in bamboo), cải mèo greens.',vi:'Món nên thử: thắng cố, lẩu cá hồi hoặc cá tầm Sa Pa, lợn cắp nách quay, thịt trâu gác bếp, cơm lam, rau cải mèo.'}},
 {id:'nightmarket',en:'Night Market',vi:'Chợ đêm Sa Pa',lat:22.3393,lon:103.8500,sp:'stalls',src:'osm',walk:'15 min',bike:'4 min',guide:0,
  f:{en:['Every evening','Grilled skewers','Love market Sat'],vi:['Mỗi tối','Đồ nướng','Chợ tình thứ Bảy']},
  d:{en:'Food stalls and brocade along the street by the market every evening: grilled pork skewers, bamboo rice, eggs and táo mèo wine.',vi:'Hàng ăn và thổ cẩm dọc phố cạnh chợ mỗi tối: thịt nướng xiên, cơm lam, trứng nướng và rượu táo mèo.'},
  t:{en:'Come after dark when the lamps are on; it is busiest on Saturday.',vi:'Đến sau khi trời tối, đèn đã bật; đông nhất tối thứ Bảy.'},
  eat:{en:'Dishes to try: grilled pork and vegetable skewers, grilled eggs, roast sweet potato and chestnuts, cơm lam, a cup of táo mèo (wild apple) wine.',vi:'Món nên thử: thịt và rau nướng xiên, trứng nướng, khoai và hạt dẻ nướng, cơm lam, một chén rượu táo mèo.'}},
 {id:'bus',en:'Sapa Bus Station',vi:'Bến xe Sa Pa',lat:22.3400,lon:103.8530,sp:'bus',src:'approx',walk:'17 min',bike:'5 min',guide:0,
