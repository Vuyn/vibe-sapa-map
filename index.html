/* Layout: a game cartridge. Skyline strip under the title, viewport canvas with camera on the left, travel journal on the right; stacks on phones. */
/* Colours come from the map itself: forest green for the accent, terrace gold for marks, sage and deep green for the page. */
:root{
  --bg:#e7ecd8; --panel:#f5f7ea; --ink:#1f2a1c; --muted:#5d6b55; --line:#bcc7a4;
  --accent:#2e7d32; --accent-ink:#ffffff; --chip:#dde5c6; --focus:#1f5fbf; --ok:#8a6a12;
  --display:'Press Start 2P',monospace; --body:'IBM Plex Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121812; --panel:#1b231b; --ink:#e6eedc; --muted:#9aa88f; --line:#33402f;
  --accent:#6fbf73; --accent-ink:#0f1a10; --chip:#263226; --focus:#8fb8ff; --ok:#e3c35a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121812; --panel:#1b231b; --ink:#e6eedc; --muted:#9aa88f; --line:#33402f;
  --accent:#6fbf73; --accent-ink:#0f1a10; --chip:#263226; --focus:#8fb8ff; --ok:#e3c35a; color-scheme:dark }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
img{max-width:100%}[hidden]{display:none!important}
header{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-bottom:14px}
.titlerow{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 20px}
h1{font-family:var(--display);font-size:clamp(13px,2.2vw,20px);margin:0;line-height:1.5;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:0}
canvas#sky{display:block;width:100%;height:84px;image-rendering:pixelated;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--line);background:#1d2a1d}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}
.stage{position:relative;background:#1d2a1d;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--line);min-width:0;overflow:hidden;touch-action:none}
canvas#map{display:block;width:100%;height:auto;aspect-ratio:4/3;max-height:80vh;image-rendering:pixelated;cursor:grab}
canvas#map.drag{cursor:grabbing}
canvas#map:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.hud{position:absolute;left:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 60px)}
.btn{font-family:var(--display);font-size:8px;padding:7px 9px;background:var(--panel);color:var(--ink);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer;line-height:1;white-space:nowrap}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn:focus-visible,.list button:focus-visible,.zoom button:focus-visible,#hour:focus-visible,#month:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.zoom{position:absolute;right:10px;top:10px;display:grid;gap:4px}
.zoom button{width:34px;height:34px;background:var(--panel);color:var(--ink);border:2px solid var(--ink);font-family:var(--display);font-size:12px;cursor:pointer;padding:0;box-shadow:3px 3px 0 var(--ink)}
canvas#mini{position:absolute;left:8px;bottom:8px;width:128px;height:118px;border:2px solid var(--ink);image-rendering:pixelated;cursor:pointer;background:#1d2a1d}
.toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-family:var(--display);font-size:8px;padding:8px 12px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
.tip{position:absolute;pointer-events:none;background:rgba(27,24,18,.9);color:#f4f4f0;font-size:12px;padding:4px 8px;border:2px solid #f4f4f0;max-width:220px;display:none;z-index:4}
.intro{position:absolute;inset:0;background:rgba(27,24,18,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.intro div{background:var(--panel);color:var(--ink);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--accent);padding:18px;max-width:380px;font-size:14px}
.intro h2{font-family:var(--display);font-size:11px;margin:0 0 10px;line-height:1.6}
.intro p{margin:0 0 8px}
.intro .btn{margin-top:6px}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#f4f4f0;font-family:var(--display);font-size:9px;text-align:center;padding:16px;line-height:2}
.panel{background:var(--panel);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--line);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.topbar{display:grid;gap:8px}
.visited{font-family:var(--display);font-size:8px;color:var(--muted)}
.visited b{color:var(--ok)}
.card .kicker{font-family:var(--display);font-size:8px;color:var(--accent);letter-spacing:.5px;text-transform:uppercase;margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stamp{display:inline-block;border:2px solid var(--ok);color:var(--ok);padding:2px 5px;transform:rotate(-4deg)}
.card h2{font-family:var(--display);font-size:11px;line-height:1.6;margin:0 0 2px;text-wrap:balance}
.card .vi{color:var(--muted);font-size:13px;margin:0 0 8px;font-style:italic}
.eta{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px;padding:0;list-style:none}
.eta li{border:2px solid var(--accent);font-size:12px;padding:3px 8px;font-variant-numeric:tabular-nums}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px;padding:0;list-style:none}
.facts li{background:var(--chip);font-size:12px;padding:3px 8px;font-variant-numeric:tabular-nums}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 10px;padding:0;list-style:none}
.times li{border:2px solid var(--line);padding:5px 6px;font-size:12px;line-height:1.3}
.times li span{display:block;font-family:var(--display);font-size:7px;color:var(--muted);margin-bottom:3px}
.card p{margin:0 0 8px;font-size:14px}
.card .tipline{border-left:3px solid var(--accent);padding-left:8px;color:var(--muted);font-size:13px}
.card .src{font-size:11px;color:var(--muted);margin:0}
.card .sketch{display:block;width:100%;height:auto;aspect-ratio:2/1;image-rendering:pixelated;border:2px solid var(--line);margin:0 0 10px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.list{margin:0;padding:0;list-style:none;display:grid;gap:3px;max-height:260px;overflow:auto;border-top:2px dashed var(--line);padding-top:10px}
.list button{width:100%;text-align:left;background:none;border:2px solid transparent;padding:4px 6px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;display:flex;gap:8px;align-items:center}
.list button:hover{border-color:var(--line)}
.list button[aria-current="true"]{border-color:var(--accent)}
.list i{width:10px;height:10px;display:inline-block;flex:none}
.list em{margin-left:auto;font-style:normal;color:var(--ok);font-family:var(--display);font-size:8px}
.list small{color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12px;color:var(--muted);margin:0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:6px}
.legend b{width:12px;height:12px;display:inline-block;border:1px solid var(--ink);flex:none}
.legend b.dash{background:repeating-linear-gradient(90deg,#c2412b 0 3px,transparent 3px 6px);border:0;height:3px}
.help{font-size:12px;color:var(--muted);margin:0}
kbd{font-family:var(--display);font-size:8px;background:var(--chip);padding:2px 4px;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.row input{flex:1;min-width:0;accent-color:var(--accent)}
.row output{font-family:var(--display);font-size:8px;min-width:4ch;font-variant-numeric:tabular-nums}
.row .lbl{min-width:3.5em}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
/* --- decluttered layout: controls live in the side panel, status in one strip --- */
canvas#sky{height:48px}
.stage{overflow:visible;touch-action:auto}
.view{position:relative;overflow:hidden;touch-action:none}
canvas#mini{bottom:42px}
#miniBtn{position:absolute;left:8px;bottom:8px;width:28px;height:28px;background:var(--panel);color:var(--ink);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-family:var(--display);font-size:10px;cursor:pointer;padding:0}
#miniBtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#miniBtn:focus-visible,.tab:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:7px 10px;background:var(--ink);color:var(--bg);font-family:var(--display);font-size:8px;line-height:1.4;font-variant-numeric:tabular-nums}
.status .sp{margin-left:auto}
.status i{display:inline-block;width:8px;height:8px;margin-right:6px;vertical-align:middle}
.status i.sun{background:#f1c232}.status i.moon{background:#b9dcff}
.scale{display:inline-flex;align-items:center;gap:6px}
.scale b{display:inline-block;height:4px;background:var(--bg);border-left:2px solid var(--bg);border-right:2px solid var(--bg);box-sizing:content-box}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tab{flex:1 1 auto;font-family:var(--display);font-size:7px;padding:8px 6px;background:var(--chip);color:var(--ink);border:2px solid var(--ink);cursor:pointer;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.pane{display:flex;flex-direction:column;gap:12px;min-width:0}
.list{max-height:min(60vh,520px);border-top:0;padding-top:0}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
/* --- 2026-11-11 fixes: map-shaped canvas, overview in the panel, taller section strip, Vietnamese-safe type --- */
canvas#sky{height:64px}
canvas#map{aspect-ratio:840/472;max-height:none}
:root{--mapw:calc(76vh * 840 / 472 + 8px)}
@media (min-width:901px){.wrap{grid-template-columns:minmax(0,var(--mapw)) minmax(300px,440px);justify-content:center}header{max-width:calc(var(--mapw) + 16px + 440px);margin-inline:auto}}
canvas#mini{position:static;display:block;width:100%;height:auto;aspect-ratio:840/472;border:2px solid var(--ink);image-rendering:pixelated;cursor:pointer;background:#1d2a1d}
.zoom button svg{display:block;margin:auto}
#lang{font-family:var(--body);font-size:11px;font-weight:600}
.vi .btn,.vi .tab,.vi .visited,.vi .status,.vi .toast,.vi .loading,.vi .card .kicker,.vi .card h2,.vi .intro h2,.vi .times li span,.vi .row output{font-family:var(--body);font-weight:600;letter-spacing:0}
.vi .btn,.vi .tab,.vi .status,.vi .toast,.vi .card .kicker,.vi .visited,.vi .row output{font-size:11px}
.vi .times li span{font-size:10px}
.vi .card h2,.vi .intro h2{font-size:15px}
.eta li.sum{background:var(--accent);color:var(--accent-ink)}
/* --- phone: the map has the whole screen. The title and section strip are hidden, and the panel is a sheet that
   shows only its row of tabs until one is tapped. Canvases never set the page width. --- */
@media (max-width:900px){
  body{padding:0}
  header{margin:0;gap:0}
  .titlerow{display:none}
  canvas#sky{height:44px;border-width:0 0 2px;box-shadow:none}
  .wrap{display:block}
  .stage{border-width:0;box-shadow:none}
  canvas#map{aspect-ratio:auto;width:100%;height:calc(100vh - 78px);height:calc(100dvh - 78px)}
  .status{padding:5px 8px;gap:4px 10px;flex-wrap:nowrap;overflow:hidden;white-space:nowrap}
  /* the row is one line: the weekday, the sky word and the north mark are left out, nothing else may shrink, and if it
     still does not fit it is the climate figure that is cut short, not the scale at the end */
  .status>span:last-child,.status #stDay,.status #stSky{display:none}
  .status>*{flex:none}
  .status #stClim{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .panel{position:fixed;left:0;right:0;bottom:0;z-index:8;max-height:74vh;max-height:74dvh;overflow:auto;border-width:3px 0 0;box-shadow:none;padding:6px 10px 12px;gap:10px;transform:translateY(calc(100% - 46px));transition:transform .2s ease}
  .panel.open{transform:none}
  .tabs{position:sticky;top:0;z-index:1;background:var(--panel);padding:2px 0 6px}
  .tab{padding:10px 4px}
}
@media (max-width:900px) and (prefers-reduced-motion:reduce){.panel{transition:none}}
</style>
</head>
<body>
<header>
  <div class="titlerow">
    <h1>SAPA · LÀO CAI · 1,500 m</h1>
    <p class="sub" id="subtitle"></p>
  </div>
  <canvas id="sky" width="512" height="84" aria-label="Mountain skyline from west to east with your position"></canvas>
</header>

<div class="wrap">
  <div class="stage" id="stage">
   <div class="view">
    <canvas id="map" tabindex="0" aria-label="Bản đồ pixel Sa Pa. Bấm vào một điểm để đi tới, kéo để dời, lăn chuột hoặc chụm ngón tay để phóng. Trên bàn phím: phím mũi tên dời bản đồ, Enter đi tới dấu chữ thập giữa màn hình."></canvas>
    <div class="zoom"><button id="zin" type="button" aria-label="Zoom in">+</button><button id="zout" type="button" aria-label="Zoom out">-</button><button id="zfit" type="button" aria-label="Fit whole map">□</button><button id="me" type="button" aria-label="Centre on me">◎</button><button id="gear" type="button" aria-label="Open settings">⚙</button></div>
    <div class="tip" id="tip"></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="loading" id="loading">ĐANG TẢI BẢN ĐỒ SA PA...</div>
    <div class="intro" id="intro" hidden><div>
      <h2 id="introTitle"></h2>
      <p id="introBody"></p>
      <button class="btn" id="introBtn" type="button"></button>
    </div></div>
   </div>
   <div class="status" id="status"><span><i id="stIcon" class="sun"></i><span id="stClock">09:00</span></span><span id="stDay">SAT</span><span id="stMonth">SEP</span><span id="stClim"></span><span id="stSky"></span><span id="stElev"></span><span class="scale sp"><b id="scaleBar" style="width:60px"></b><span id="scaleTxt">1 km</span></span><span>N ▲</span></div>
  </div>

  <aside class="panel" id="panel">
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-place" role="tab" aria-selected="true" aria-controls="pane-place" type="button">PLACE</button>
      <button class="tab" id="tab-list" role="tab" aria-selected="false" aria-controls="pane-list" type="button">PLACES</button>
      <button class="tab" id="tab-settings" role="tab" aria-selected="false" aria-controls="pane-settings" type="button">SETTINGS</button>
      <button class="tab" id="tab-about" role="tab" aria-selected="false" aria-controls="pane-about" type="button">LEGEND</button>
    </div>
    <section class="pane" id="pane-place" role="tabpanel" aria-labelledby="tab-place">
      <div class="card" id="card"></div>
      <div class="tools">
        <button class="btn" id="walk" type="button">WALK HERE</button>
        <button class="btn" id="home" type="button">BACK TO TOWN</button>
      </div>
    </section>
    <section class="pane" id="pane-list" role="tabpanel" aria-labelledby="tab-list" hidden>
      <span class="visited" id="visitedCount"></span>
      <ul class="list" id="list"></ul>
    </section>
    <section class="pane" id="pane-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
      <div class="row"><span class="lbl" id="timeLabel">Time</span><input type="range" id="hour" min="0" max="24" step="0.25" value="9" aria-label="Hour of day"><output id="hourOut">09:00</output><button class="btn" id="autoTime" aria-pressed="true" type="button">AUTO</button></div>
      <div class="row"><span class="lbl" id="monthLabel">Month</span><input type="range" id="month" min="1" max="12" step="1" value="9" aria-label="Month"><output id="monthOut">Sep</output></div>
      <div class="toggles">
        <button class="btn" id="weather" type="button">SKY: AUTO</button>
        <button class="btn" id="dayBtn" type="button">DAY: SAT</button>
        <button class="btn" id="labels" aria-pressed="true" type="button">LABELS</button>
        <button class="btn" id="routes" aria-pressed="true" type="button">TREKS</button>
        <button class="btn" id="shops" aria-pressed="false" type="button">SHOP NAMES</button>
        <button class="btn" id="skyToggle" aria-pressed="true" type="button">SKYLINE</button>
        <button class="btn" id="sound" aria-pressed="false" type="button">SOUND OFF</button>
        <button class="btn" id="lang" type="button">TIẾNG VIỆT</button>
      </div>
    </section>
    <section class="pane" id="pane-about" role="tabpanel" aria-labelledby="tab-about" hidden>
      <ul class="legend" id="legend"></ul>
      <p class="help" id="help"></p>
      <p class="help" id="credits"></p>
    </section>
    <canvas id="mini" width="840" height="472" aria-label="Overview map. Click to jump there."></canvas>
  </aside>
</div>

 {id:'church',en:'Sapa Stone Church',vi:'Nhà thờ Đá Sa Pa',lat:22.33512,lon:103.84228,sp:'church',big:1,major:1,src:'osm',walk:'0',bike:'0',guide:0,
  f:{en:['Finished 1935','1,500 m','Town centre'],vi:['Hoàn thành 1935','1.500 m','Trung tâm']},
  d:{en:'The stone church, begun by French missionaries in the mid-1920s and finished in 1935, is the heart of town. On Saturday evenings the square in front fills for the love market, today a staged evening of Hmong and Dao music.',vi:'Nhà thờ đá do các giáo sĩ Pháp khởi công giữa thập niên 1920 và hoàn thành năm 1935, là trái tim của Sa Pa. Tối thứ Bảy, quảng trường trước nhà thờ đông người xem chợ tình, nay là đêm diễn tái hiện với tiếng khèn của người Mông, người Dao.'},
  t:{en:'Every distance on this map is measured from this square.',vi:'Mọi khoảng cách trên bản đồ đều tính từ sân nhà thờ.'}},
 {id:'sunplaza',en:'Sun Plaza & Mountain Train',vi:'Sun Plaza & Ga tàu hỏa leo núi',lat:22.33426,lon:103.84037,sp:'sunplaza',big:1,src:'osm',walk:'4 min',bike:'1 min',guide:0,
  f:{en:['Built 2018','Funicular 2 km','4-6 min to cable car'],vi:['Xây 2018','Tàu leo núi 2 km','4-6 phút tới cáp treo']},
  d:{en:'A building in French railway-station style on the square. The Mường Hoa mountain train leaves from inside and glides 2 km down the valley side to the cable car base.',vi:'Tòa nhà kiểu ga xe lửa Pháp bên quảng trường. Tàu hỏa leo núi Mường Hoa xuất phát từ đây, chạy 2 km xuống ga cáp treo.'},
  t:{en:'Buy the combined train and cable car ticket here to skip the taxi.',vi:'Mua vé gộp tàu và cáp treo ở đây để khỏi đi taxi.'}},
 {id:'museum',en:'Sapa Museum',vi:'Bảo tàng Sa Pa',lat:22.33554,lon:103.84010,sp:'museum',src:'osm',walk:'5 min',bike:'1 min',guide:0,
  f:{en:['Free entry','Town history','Ethnic costume'],vi:['Miễn phí','Lịch sử Sa Pa','Trang phục dân tộc']},
  d:{en:'A small museum above the square, in the grounds of the tourist information centre at 2 Fansipan street. It tells how the town grew and shows the costumes and farm tools of the local peoples.',vi:'Bảo tàng nhỏ phía trên quảng trường, trong khuôn viên Trung tâm Thông tin du lịch ở số 2 phố Fansipan. Nơi đây kể chuyện hình thành Sa Pa và trưng bày trang phục, nông cụ của các dân tộc địa phương.'},
  t:{en:'Thirty minutes, and a good first stop when it rains. It closes for lunch from 11:30 to 13:30.',vi:'Ba mươi phút, điểm dừng tốt khi trời mưa. Nghỉ trưa từ 11h30 đến 13h30.'}},
 /* the hotel long known as Victoria Sapa: later BB Sapa Resort, then Sapa Mountain Resort, and The Myst Sapa Resort since 15 September 2026 */
 {id:'victoria',en:'The Myst Sapa (ex-Victoria)',vi:'The Myst Sapa (Victoria cũ)',lat:22.33696,lon:103.84278,sp:'hotel',src:'osm',walk:'5 min',bike:'1 min',guide:0,
  f:{en:['Opened 1998','Was Victoria Sapa','Mountain chalet style'],vi:['Mở cửa 1998','Trước là Victoria Sapa','Kiểu nhà gỗ miền núi']},
  d:{en:'Opened in 1998 as the Victoria Sapa Resort, a mountain-chalet hotel in a garden on Hoàng Diệu street, a few minutes on foot above the church square. After several changes of name and a renovation it reopened in September 2026 as The Myst Sapa Resort, with an indoor pool.',vi:'Mở cửa năm 1998 với tên Victoria Sapa Resort, khách sạn kiểu nhà gỗ miền núi giữa vườn cây trên phố Hoàng Diệu, cách quảng trường nhà thờ vài phút đi bộ. Sau vài lần đổi tên và một đợt sửa sang, nơi này mở lại tháng 9/2026 với tên The Myst Sapa Resort, có bể bơi trong nhà.'},
  t:{en:'The Victoria Express sleeper carriages that once brought its guests from Hanoi stopped during Covid. The hotel no longer has a train of its own.',vi:'Toa giường nằm Victoria Express từng đưa khách của khách sạn từ Hà Nội lên đã ngừng chạy từ dịch Covid. Khách sạn không còn tàu riêng.'}},
 {id:'lake',en:'Sapa Lake',vi:'Hồ Sa Pa',lat:22.33844,lon:103.84735,sp:'isle',src:'osm',walk:'6 min',bike:'2 min',guide:0,
  f:{en:['Town park','One small island','Evening walks'],vi:['Công viên','Một đảo nhỏ','Dạo tối']},
  d:{en:'A narrow lake ringed by a promenade, with one small wooded island near its eastern end. Cafés on the slope above look across the water to Hàm Rồng.',vi:'Hồ hẹp có đường dạo quanh, với một đảo nhỏ rợp cây gần đầu phía đông. Quán cà phê trên dốc nhìn qua mặt nước sang Hàm Rồng.'},
  t:{en:'When the afternoon fog comes down, the far shore disappears in minutes.',vi:'Chiều sương xuống, bờ bên kia biến mất trong vài phút.'}},
 {id:'hamrong',en:'Ham Rong Mountain',vi:'Núi Hàm Rồng',lat:22.33363,lon:103.84680,sp:'hill',major:1,src:'osm',walk:'1.5 h loop',bike:'-',guide:0,
  f:{en:['Entry about 70,000 VND','Top over 1,800 m','Orchids, Cloud Yard'],vi:['Vé khoảng 70.000 đ','Đỉnh hơn 1.800 m','Vườn lan, Sân Mây']},
  d:{en:'"Dragon Jaw" rises straight out of town behind the church. Stone steps climb through orchid gardens and the Thạch Lâm rock garden to Cloud Yard (Sân Mây), a lookout at about 1,800 m with the whole town below.',vi:'Núi "hàm rồng" mọc lên ngay sau nhà thờ. Bậc đá đi qua vườn lan và vườn đá Thạch Lâm lên Sân Mây, đài ngắm ở độ cao khoảng 1.800 m nhìn xuống toàn cảnh Sa Pa.'},
  t:{en:'The gate is a 5-minute walk from the church. Tickets are sold there.',vi:'Cổng cách nhà thờ 5 phút đi bộ, mua vé ngay tại cổng.'}},
 {id:'monastery',en:'Truc Lam Zen Monastery',vi:'Thiền viện Trúc Lâm Đại Giác',lat:22.34074,lon:103.84942,sp:'pagoda',big:1,src:'osm',walk:'15 min',bike:'4 min',guide:0,
  f:{en:['Trúc Lâm Zen','Inaugurated 2020','North-east of town'],vi:['Thiền phái Trúc Lâm','Khánh thành 2020','Đông bắc trung tâm']},
  d:{en:'A Zen monastery of the Trúc Lâm Yên Tử school on the slope north-east of town, on Điện Biên Phủ street. It was inaugurated in 2020 and has a main hall, a bell tower and a drum tower.',vi:'Thiền viện thuộc Thiền phái Trúc Lâm Yên Tử trên sườn đồi phía đông bắc trung tâm Sa Pa, trên đường Điện Biên Phủ. Thiền viện khánh thành năm 2020, có chánh điện, lầu chuông và gác trống.'},
  t:{en:'Dress modestly and keep your voice down: it is a working monastery.',vi:'Ăn mặc kín đáo và giữ yên lặng: đây là nơi tu hành.'}},
 {id:'market',en:'Sapa Market',vi:'Chợ Sa Pa',lat:22.33829,lon:103.85198,sp:'market',src:'osm',walk:'15 min',bike:'4 min',guide:0,
  f:{en:['Open daily','Brocade, herbs','Here since 2015'],vi:['Họp hằng ngày','Thổ cẩm, thuốc bắc','Ở đây từ 2015']},
  d:{en:'The three-storey market east of the lake, moved here from the old town centre in 2015. Its stalls sell brocade, herbal medicine, dried goods and souvenirs, and there is a row of cooked-food stalls.',vi:'Chợ ba tầng phía đông hồ, chuyển về đây từ khu trung tâm cũ năm 2015. Các sạp bán thổ cẩm, thuốc bắc, hàng khô và đồ lưu niệm, có cả dãy hàng ăn.'},
  t:{en:'Sunday morning is the traditional market day, when people from the villages come in to trade.',vi:'Sáng Chủ nhật là phiên chợ truyền thống, khi bà con các bản xuống chợ.'},
  eat:{en:'Sa Pa dishes to try: thắng cố (horse stew), Sa Pa salmon or sturgeon hotpot, roast lợn cắp nách (small free-range pig), smoked buffalo, cơm lam (sticky rice in bamboo), cải mèo greens.',vi:'Món Sa Pa nên thử: thắng cố, lẩu cá hồi hoặc cá tầm Sa Pa, lợn cắp nách quay, thịt trâu gác bếp, cơm lam, rau cải mèo.'}},
 {id:'nightmarket',en:'Night Market',vi:'Chợ đêm Sa Pa',lat:22.3393,lon:103.8500,sp:'stalls',src:'osm',walk:'15 min',bike:'4 min',guide:0,
  f:{en:['Busiest at weekends','Grilled skewers','Beside Sapa Market'],vi:['Đông nhất cuối tuần','Đồ nướng','Cạnh chợ Sa Pa']},
  d:{en:'Food stalls and brocade on N1 street and in the yard beside Sapa Market, running since 2017. Grilled skewers, bamboo rice, roast chestnuts and táo mèo wine are the staples.',vi:'Hàng ăn và thổ cẩm trên đường N1 và sân cạnh chợ Sa Pa, họp từ năm 2017. Đồ nướng xiên, cơm lam, hạt dẻ nướng và rượu táo mèo là những món chính.'},
  t:{en:'Come after dark, best at the weekend. The Saturday love market is at the church square, not here.',vi:'Đến sau khi trời tối, vui nhất vào cuối tuần. Chợ tình tối thứ Bảy ở quảng trường nhà thờ, không phải ở đây.'},
  eat:{en:'Dishes to try: grilled pork and vegetable skewers, roast sweet potato and chestnuts, cơm lam, a cup of táo mèo (wild apple) wine.',vi:'Món nên thử: thịt và rau nướng xiên, khoai và hạt dẻ nướng, cơm lam, một chén rượu táo mèo.'}},
 {id:'bus',en:'Sapa Bus Station',vi:'Bến xe Sa Pa',lat:22.3400,lon:103.8530,sp:'bus',src:'approx',walk:'17 min',bike:'5 min',guide:0,
  f:{en:['Hanoi 5-6 h','Lào Cai 1 h'],vi:['Hà Nội 5-6 h','Lào Cai 1 h']},
  d:{en:'Buses from Lào Cai and some sleeper buses from Hanoi end here, beside the market. Other Hanoi operators set down at their own offices in town.',vi:'Xe từ Lào Cai và một số xe giường nằm từ Hà Nội về bến này, cạnh chợ. Nhiều nhà xe Hà Nội khác trả khách tại văn phòng riêng trong phố.'},
  t:{en:'Book the return seat a day early on holiday weekends.',vi:'Cuối tuần lễ nên đặt vé về trước một ngày.'}},
 {id:'cable',en:'Fansipan Cable Car Base',vi:'Ga cáp treo Hoàng Liên',lat:22.3366,lon:103.8250,sp:'station',big:1,major:1,src:'osm',walk:'35 min',bike:'8 min',guide:0,
  f:{en:['6,293 m long','1,410 m rise','~15 min ride'],vi:['Dài 6.293 m','Chênh cao 1.410 m','~15 phút']},
  d:{en:'The Sun World base west of town. The mountain train from Sun Plaza stops at Mường Hoa station, and the cable car leaves from Hoàng Liên station next door. The three-rope cable car holds the world record for height gain and was the longest of its kind when it opened in 2016.',vi:'Khu ga Sun World phía tây trung tâm. Tàu hỏa leo núi từ Sun Plaza dừng ở ga Mường Hoa, cáp treo xuất phát từ ga Hoàng Liên ngay bên cạnh. Cáp treo ba dây giữ kỷ lục thế giới về độ chênh cao và từng dài nhất thế giới khi khánh thành năm 2016.'},
  t:{en:'The first car leaves at 8:00 on weekdays and 7:30 at weekends. Hours change with the season and the weather, so check the day before.',vi:'Chuyến đầu lúc 8h ngày thường và 7h30 cuối tuần. Giờ chạy đổi theo mùa và thời tiết, nên xem lại trước một ngày.'}},
 /* the id is from an earlier version that took Đỗ Quyên, the summit funicular's lower station, for the cable car's top station */
 {id:'doquyen',en:'Fansipan Top Station',vi:'Ga Fansipan',lat:22.30527,lon:103.77531,sp:'station',big:1,src:'osm',walk:'-',bike:'-',guide:0,
  f:{en:['Over 3,000 m','600 steps to the top','21.5 m bronze Buddha'],vi:['Trên 3.000 m','600 bậc lên đỉnh','Đại tượng Phật 21,5 m']},
  d:{en:'Where the cable car arrives. A chain of pagodas and a 21.5 m bronze Amitabha Buddha line the 600 steps to the summit. A short funicular from Đỗ Quyên station, by the lower pagoda, runs up to Trúc Mây station, about 50 steps below the top.',vi:'Nơi cáp treo tới. Quần thể chùa và đại tượng Phật A Di Đà bằng đồng cao 21,5 m nằm dọc 600 bậc đá lên đỉnh. Tàu hỏa leo núi ngắn từ ga Đỗ Quyên, cạnh chùa Hạ, chạy lên ga Trúc Mây, cách đỉnh khoảng 50 bậc.'},
  t:{en:'Six hundred steps if you skip the funicular. Go slow, the air is thin.',vi:'Sáu trăm bậc nếu không đi tàu leo núi. Đi chậm, không khí loãng.'}},
 {id:'fansipan',en:'Fansipan Summit',vi:'Đỉnh Fansipan',lat:22.30308,lon:103.77544,sp:'peak',big:1,major:1,src:'osm',walk:'2 days trek',bike:'-',guide:2,
  f:{en:['3,147 m','Roof of Indochina','Hoàng Liên Sơn'],vi:['3.147 m','Nóc nhà Đông Dương','Hoàng Liên Sơn']},
  d:{en:'The highest peak in Vietnam, Laos and Cambodia: 3,147.3 m in the 2019 survey, though the marker on top still reads 3,143 m. Trekkers climb two days from Trạm Tôn through bamboo and rhododendron forest.',vi:'Đỉnh cao nhất Việt Nam, Lào và Campuchia: 3.147,3 m theo số đo năm 2019, dù cột mốc trên đỉnh vẫn ghi 3.143 m. Người leo núi mất hai ngày từ Trạm Tôn qua rừng trúc và đỗ quyên.'},
  t:{en:'It is 7 to 10 °C colder than town. Bring a jacket even in June.',vi:'Lạnh hơn trung tâm Sa Pa 7-10 °C. Mang áo khoác kể cả tháng 6.'}},
 {id:'tramton',en:'Tram Ton Trailhead',vi:'Trạm Tôn',lat:22.35507,lon:103.76072,sp:'gate',src:'osm',walk:'4 h',bike:'30 min',guide:0,
  f:{en:['About 1,900 m','Park ranger gate','Fansipan trail'],vi:['Khoảng 1.900 m','Trạm kiểm lâm','Đường leo Fansipan']},
  d:{en:'The Hoàng Liên National Park gate where the classic Fansipan trek starts: lunch at the 2,200 m hut, the night at the 2,800 m camp, the summit the next morning.',vi:'Cổng Vườn quốc gia Hoàng Liên, nơi bắt đầu đường leo Fansipan kinh điển: nghỉ trưa ở lán 2.200 m, ngủ đêm ở lán 2.800 m, sáng hôm sau lên đỉnh.'},
  t:{en:'A park permit and a guide are required. Book through a trekking agency in town.',vi:'Bắt buộc có giấy phép vào rừng và người dẫn đường. Nên đặt qua công ty trekking ở Sa Pa.'}},
 {id:'pass',en:'O Quy Ho Pass · Heaven’s Gate',vi:'Đèo Ô Quy Hồ · Cổng Trời',lat:22.35297,lon:103.76481,sp:'pass',major:1,src:'osm',walk:'4 h',bike:'30 min',guide:0,
  f:{en:['About 2,000 m','~50 km long','Four great passes'],vi:['Khoảng 2.000 m','Dài ~50 km','Tứ đại đỉnh đèo']},
  d:{en:'One of the four great passes of the northwest, climbing over the Hoàng Liên Sơn into Lai Châu. The Heaven’s Gate viewpoint at the top sometimes sees snow.',vi:'Một trong tứ đại đỉnh đèo Tây Bắc, vượt Hoàng Liên Sơn sang Lai Châu. Điểm ngắm Cổng Trời trên đỉnh đôi khi có tuyết.'},
  t:{en:'Ride it, do not bus it. The fog can be thick: go slowly.',vi:'Đi xe máy, đừng đi xe khách. Sương có thể rất dày: đi chậm.'}},
 {id:'silver',en:'Silver Waterfall',vi:'Thác Bạc',lat:22.36324,lon:103.77683,sp:'falls',major:1,src:'osm',walk:'3.5 h',bike:'25 min',guide:0,
  f:{en:['200 m fall','About 1,800 m','Pass road'],vi:['Cao 200 m','Khoảng 1.800 m','Đường đèo']},
  d:{en:'A white ribbon of more than 200 metres down the mountainside, right beside national road 4D and about 12 km from town.',vi:'Dải nước trắng cao hơn 200 m đổ xuống sườn núi ngay bên quốc lộ 4D, cách trung tâm Sa Pa khoảng 12 km.'},
  t:{en:'Combine with Love Waterfall and the pass in one motorbike morning.',vi:'Gộp với Thác Tình Yêu và đèo trong một buổi sáng xe máy.'}},
 {id:'love',en:'Love Waterfall',vi:'Thác Tình Yêu',lat:22.34734,lon:103.77243,sp:'falls',src:'osm',walk:'4 h',bike:'32 min',guide:0,
  f:{en:['100 m fall','Golden Stream','National park'],vi:['Cao 100 m','Suối Vàng','Vườn quốc gia']},
  d:{en:'A forest path of about 1.5 km from Trạm Tôn follows the Golden Stream to the fall, inside Hoàng Liên National Park south of the pass road.',vi:'Lối mòn khoảng 1,5 km trong rừng từ Trạm Tôn men theo Suối Vàng tới thác, trong Vườn quốc gia Hoàng Liên, phía nam đường đèo.'},
  t:{en:'Rhododendrons flower along the path in March.',vi:'Đỗ quyên nở dọc lối đi vào tháng 3.'}},
 {id:'catcat',en:'Cat Cat Village',vi:'Bản Cát Cát',lat:22.32853,lon:103.83468,sp:'house',major:1,src:'osm',walk:'30 min',bike:'6 min',guide:0,
  f:{en:['Black Hmong','1,270 m','1925 hydro station'],vi:['Mông đen','1.270 m','Thủy điện Pháp 1925']},
  d:{en:'The closest village to town, down a steep lane of hemp looms and indigo vats. At the bottom are Tiên Sa waterfall and a French hydro station built in 1925, silent since 1993.',vi:'Bản gần trung tâm Sa Pa nhất, xuống con dốc đầy khung dệt lanh và chum chàm. Dưới cùng là thác Tiên Sa và trạm thủy điện người Pháp xây năm 1925, ngừng phát điện từ năm 1993.'},
  t:{en:'Walk down, take a xe ôm back up. The climb home is brutal.',vi:'Đi bộ xuống, bắt xe ôm lên. Leo về rất mệt.'}},
 {id:'sinchai',en:'Sin Chai',vi:'Sín Chải',lat:22.33433,lon:103.82231,sp:'house',src:'approx',walk:'50 min',bike:'10 min',guide:0,
  f:{en:['Black Hmong','Quiet','Cardamom'],vi:['Mông đen','Yên tĩnh','Thảo quả']},
  d:{en:'A larger, quieter Hmong village just beyond Cát Cát, with cardamom on the slopes and few tourists.',vi:'Bản Mông lớn hơn, vắng hơn ngay sau Cát Cát, trồng thảo quả trên sườn núi, ít khách.'},
  t:{en:'Loop Cát Cát and Sín Chải in one morning on foot.',vi:'Đi bộ vòng Cát Cát và Sín Chải trong một buổi sáng.'}},
 {id:'ylinhho',en:'Y Linh Ho',vi:'Ý Linh Hồ',lat:22.3160,lon:103.8520,sp:'house',src:'approx',walk:'1.2 h',bike:'12 min',guide:0,
  f:{en:['Black Hmong','Trek stop'],vi:['Mông đen','Điểm dừng trek']},
  d:{en:'First stop on the valley trek, where the path leaves the road and drops onto the terraces.',vi:'Điểm dừng đầu tiên của tuyến trek thung lũng, nơi lối mòn rời đường lớn và xuống ruộng bậc thang.'},
  t:{en:'Buy water here. The next shop is Lao Chải.',vi:'Mua nước ở đây. Quán tiếp theo là Lao Chải.'}},
 {id:'laochai',en:'Lao Chai',vi:'Lao Chải',lat:22.31002,lon:103.87623,sp:'house',major:1,src:'osm',walk:'2 h',bike:'15 min',guide:1,
  f:{en:['Black Hmong','1,000 m','Terrace views'],vi:['Mông đen','1.000 m','Ngắm ruộng bậc thang']},
  d:{en:'The first big village on the valley trek. Terraces cascade a thousand steps down to the Mường Hoa river.',vi:'Bản lớn đầu tiên trên tuyến trek. Ruộng bậc thang đổ nghìn bậc xuống suối Mường Hoa.'},
  t:{en:'Classic half-day: Sapa, Ý Linh Hồ, Lao Chải, Tả Van, lunch by the river.',vi:'Nửa ngày kinh điển: Sa Pa, Ý Linh Hồ, Lao Chải, Tả Van, ăn trưa bên suối.'}},
 {id:'tavan',en:'Ta Van',vi:'Tả Van',lat:22.30266,lon:103.88858,sp:'house',major:1,src:'osm',walk:'3 h',bike:'25 min',guide:1,
  f:{en:['Giáy people','990 m','Homestays'],vi:['Người Giáy','990 m','Homestay']},
  d:{en:'A Giáy village on the valley floor, now the homestay capital. Stilt houses, buffalo in the paddies, rice wine after dinner.',vi:'Bản người Giáy dưới đáy thung lũng, thủ phủ homestay. Nhà sàn, trâu dưới ruộng, rượu gạo sau bữa tối.'},
  t:{en:'Stay one night. The valley at dawn is the real Sapa.',vi:'Ở lại một đêm. Thung lũng lúc bình minh mới là Sa Pa thật.'}},
 {id:'rocks',en:'Ancient Rock Field',vi:'Bãi đá cổ Sa Pa',lat:22.30407,lon:103.89856,sp:'rocks',src:'osm',walk:'3.2 h',bike:'28 min',guide:0,
  f:{en:['~200 carved stones','National relic 1994','Near Bản Pho'],vi:['~200 phiến đá khắc','Di tích quốc gia 1994','Gần bản Pho']},
  d:{en:'Around two hundred boulders carved with lines, human figures and map-like patterns that no one has fully read. A national relic since 1994; nobody has dated the carvings for certain.',vi:'Khoảng hai trăm tảng đá khắc đường nét, hình người và những hoa văn như bản đồ mà chưa ai đọc hết. Di tích quốc gia từ năm 1994; đến nay chưa ai định được chắc chắn niên đại các hình khắc.'},
  t:{en:'The small display house by the road has drawings and photographs of the carvings.',vi:'Nhà trưng bày nhỏ bên đường có bản vẽ và ảnh tư liệu về các hình khắc.'}},
 {id:'giang',en:'Giang Ta Chai',vi:'Giàng Tả Chải',lat:22.2975,lon:103.9050,sp:'dao',src:'approx',walk:'4 h',bike:'35 min',guide:1,
  f:{en:['Red Dao','Rattan bridge','Waterfall'],vi:['Dao đỏ','Cầu mây','Thác nước']},
  d:{en:'A village of Red Dao, Hmong and Giáy families above the Mường Hoa, known for its bamboo forest and its waterfall. The old rattan bridge (cầu mây) hangs over the stream below.',vi:'Bản của người Dao đỏ, Mông và Giáy phía trên suối Mường Hoa, nổi tiếng với rừng trúc và thác nước. Cây cầu mây cổ bắc qua suối ở phía dưới.'},
  t:{en:'Continue downstream to Sử Pán along the valley road.',vi:'Đi tiếp xuôi dòng tới Sử Pán theo đường thung lũng.'}},
 {id:'supan',en:'Su Pan',vi:'Sử Pán',lat:22.29366,lon:103.92284,sp:'house',major:1,src:'osm',walk:'5 h',bike:'45 min',guide:1,
  f:{en:['Mostly Hmong','1,070 m','Valley road'],vi:['Chủ yếu người Mông','1.070 m','Đường thung lũng']},
  d:{en:'Hillside villages at the lower end of the valley, almost all Hmong, strung along the valley road above the Mường Hoa stream. Bản Hồ lies further down the valley.',vi:'Các bản trên sườn núi cuối thung lũng, gần như toàn người Mông, nằm dọc đường thung lũng phía trên suối Mường Hoa. Xuôi tiếp thung lũng là Bản Hồ.'},
  t:{en:'A car can collect you here, right on the valley road.',vi:'Có thể gọi xe đón ở đây, ngay trên đường thung lũng.'}},
 {id:'banho',en:'Ban Ho',vi:'Bản Hồ',lat:22.26369,lon:103.96805,sp:'house',major:1,src:'osm',walk:'7 h',bike:'1 h',guide:1,
  f:{en:['Tày people','Warm valley floor','Hot mineral baths'],vi:['Người Tày','Đáy thung lũng ấm','Tắm khoáng nóng']},
  d:{en:'A Tày village far down the valley, about a thousand metres lower and noticeably warmer than Sapa. Its centre, Bản Dền, sits where the La Ve stream joins the Mường Hoa, with hot mineral baths and waterfalls nearby.',vi:'Bản người Tày cuối thung lũng, thấp hơn Sa Pa khoảng nghìn mét và ấm rõ rệt. Trung tâm là Bản Dền, nơi suối La Ve gặp suối Mường Hoa, gần đó có khu tắm khoáng nóng và thác nước.'},
  t:{en:'The far end of the two-day valley trek. Arrange a car back to town.',vi:'Điểm cuối tuyến trek thung lũng hai ngày. Nên đặt xe về Sa Pa.'}},
 {id:'seomyty',en:'Seo My Ty Lake',vi:'Hồ Séo Mý Tỷ',lat:22.25503,lon:103.88706,sp:'tarn',src:'osm',walk:'7 h',bike:'1.5 h',guide:1,
  f:{en:['Above 1,600 m','Séo Chong Hô dam','Hmong hamlet'],vi:['Trên 1.600 m','Đập Séo Chong Hô','Thôn người Mông']},
  d:{en:'A reservoir high on the flank of the Hoàng Liên range, held back by the dam of the Séo Chong Hô hydropower plant and often called the highest man-made lake in Vietnam. The Hmong hamlet of Séo Mý Tỷ stands by the water, inside Hoàng Liên National Park.',vi:'Hồ chứa trên sườn dãy Hoàng Liên, do đập thủy điện Séo Chong Hô tạo nên, thường được gọi là hồ nhân tạo cao nhất Việt Nam. Thôn người Mông Séo Mý Tỷ nằm bên hồ, trong Vườn quốc gia Hoàng Liên.'},
  t:{en:'About 20 km from town by way of Lao Chải and Tả Van. The last stretch above Tả Van is rough: motorbikes and off-road cars only.',vi:'Cách trung tâm Sa Pa khoảng 20 km, đi qua Lao Chải và Tả Van. Đoạn cuối từ Tả Van lên rất xấu, chỉ hợp xe máy và xe gầm cao.'}},
 /* the Red Dao village the guides call "Thanh Kim" is Lếch Dao, a hamlet of the old Thanh Kim commune. OpenStreetMap has
    no point for it. It is placed on the houses the map shows beside the GeoNames point for Bản Lếch (22.2833, 103.9667),
    about 800 m north of Topas Ecolodge, whose own address is Lếch Dao village */
 {id:'thanhkim',en:'Lech Dao (Thanh Kim)',vi:'Lếch Dao (Thanh Kim)',lat:22.28335,lon:103.96338,sp:'dao',src:'approx',walk:'5.5 h',bike:'45 min',guide:1,
  f:{en:['Red Dao','About 18 km from town','Topas Ecolodge'],vi:['Dao đỏ','Cách trung tâm 18 km','Topas Ecolodge']},
  d:{en:'A Red Dao hamlet of the old Thanh Kim commune, on the hillside beside Topas Ecolodge. Thanh Kim became part of Thanh Bình commune in 2020 and of Bản Hồ commune in 2025; the Hmong hamlet of Lếch Mông lies higher up the slope.',vi:'Thôn người Dao đỏ của xã Thanh Kim cũ, trên sườn đồi cạnh Topas Ecolodge. Thanh Kim nhập vào xã Thanh Bình năm 2020 rồi vào xã Bản Hồ năm 2025; thôn người Mông Lếch Mông nằm cao hơn trên sườn núi.'},
  t:{en:'More than twenty households here take guests: ask in the hamlet for a homestay.',vi:'Hơn hai mươi hộ ở đây làm homestay đón khách: cứ hỏi ngay trong thôn.'}},
 {id:'trungchai',en:'Trung Chai',vi:'Trung Chải',lat:22.3973182,lon:103.8900507,sp:'house',src:'osm',walk:'3.5 h',bike:'25 min',guide:0,
  f:{en:['Hmong and Dao','Road to Lào Cai','Móng Sến viaduct'],vi:['Mông và Dao','Đường về Lào Cai','Cầu Móng Sến']},
  d:{en:'Hmong and Dao hamlets along the road down to Lào Cai, part of Tả Phìn commune since July 2025. The Móng Sến viaduct crosses the valley here on an 83 m pier, reported as the tallest of any viaduct in Vietnam.',vi:'Các thôn người Mông và Dao dọc đường xuống Lào Cai, thuộc xã Tả Phìn từ tháng 7/2025. Cầu cạn Móng Sến vượt thung lũng ở đây trên trụ cao 83 m, được báo chí gọi là trụ cầu cạn cao nhất Việt Nam.'},
  t:{en:'Landslides have closed the viaduct more than once since 2025. When it is shut, traffic takes the old road 4D.',vi:'Sạt lở đã khiến cầu phải đóng nhiều lần từ năm 2025. Khi cầu đóng, xe đi theo quốc lộ 4D cũ.'}},
 {id:'thanhbinh',en:'Thanh Binh',vi:'Thanh Bình',lat:22.3028375,lon:103.9849741,sp:'dao',src:'osm',walk:'8 h',bike:'1.2 h',guide:1,
  f:{en:['Red Dao and Hmong','Former commune','Above the Ngòi Bo'],vi:['Dao đỏ và Mông','Xã cũ','Phía trên Ngòi Bo']},

 document.getElementById('legend').innerHTML=u.legend.map(e=>'<li><b class="'+(e[0]==='dash'?'dash':'')+'" style="'+(e[0]==='dash'?'':'background:'+e[0])+'"></b>'+e[1]+'</li>').join('');document.getElementById('help').innerHTML=u.help;document.getElementById('credits').textContent=u.credits;
 document.getElementById('introTitle').textContent=u.welcome;document.getElementById('introBody').textContent=u.intro.replace('{n}',LM.length);document.getElementById('introBtn').textContent=u.go;applyMonth();renderList();renderCard();skyDirty=true;updateStatus();}
function applyMonth(){monthEl.value=month;monthOut.textContent=U().months[month-1];}
function setMonth(m){month=m;applyMonth();invalidateTerrain();pickAutoSky();renderCard();say(U().seasons[month]);saveState();}
const weatherBtn=document.getElementById('weather'),soundBtn=document.getElementById('sound'),dayBtn=document.getElementById('dayBtn');
/* tabs: Place, Places, Settings, Legend. On a phone the panel is a sheet at the bottom of the screen: only its tab row
   shows until you tap a tab, and tapping the open tab again, or the map, folds it away. */
const TABS=['place','list','settings','about'];let curTab='place';
function showTab(id){curTab=id;for(const t of TABS){const on=t===id;document.getElementById('tab-'+t).setAttribute('aria-selected',String(on));document.getElementById('pane-'+t).hidden=!on;}}
function openSheet(on){panelEl.classList.toggle('open',!!on);}
TABS.forEach(t=>document.getElementById('tab-'+t).addEventListener('click',()=>{const closing=PHONE()&&panelEl.classList.contains('open')&&curTab===t;showTab(t);if(PHONE())openSheet(!closing);}));
document.getElementById('gear').addEventListener('click',()=>{showTab('settings');if(PHONE())openSheet(true);else if(panelEl.scrollIntoView)panelEl.scrollIntoView({block:'nearest',behavior:'smooth'});});
const skyToggle=document.getElementById('skyToggle');
skyToggle.setAttribute('aria-pressed',String(showSky));
skyToggle.addEventListener('click',()=>{showSky=!showSky;skyToggle.setAttribute('aria-pressed',String(showSky));sky.hidden=!showSky;resize();saveState();});
/* status strip under the map: weekday, time, month, sky, elevation, scale bar, north */
const stIcon=document.getElementById('stIcon'),stClock=document.getElementById('stClock'),stDay=document.getElementById('stDay'),stMonth=document.getElementById('stMonth'),stSky=document.getElementById('stSky'),stElev=document.getElementById('stElev'),stClim=document.getElementById('stClim'),scaleBar=document.getElementById('scaleBar'),scaleTxt=document.getElementById('scaleTxt');
const NICE=[50,100,250,500,1000,2000,5000];let lastBusy='';
function updateStatus(){const u=U(),e=eAt(hero.x,hero.y),sk=skyNow();stIcon.className=darkness(hour)>0.3?'moon':'sun';stClock.textContent=u.hourFmt(Math.round(hour*2)/2);stDay.textContent=u.days[day];stMonth.textContent=u.months[month-1].toUpperCase();
 stSky.textContent=u.skyNames[sk===3&&winterSnow()&&e>1800?4:sk];stElev.textContent=Math.round(e).toLocaleString('en')+' m';
 /* typical weather for the month: temperature falls about 0.6 °C for every 100 m climbed */
 const tempTxt='~'+Math.round(CLIM_T[month-1]-(e-1500)*0.006)+'°C';stClim.textContent=tempTxt+' · '+CLIM_R[month-1]+' mm';stClim.title=u.climTip;
 const r=cv.getBoundingClientRect();const cssPerM=T*fitScale*cam.z/MPT*(r.width/(cv.width||1));let best=NICE[0];const room=PHONE()?44:110;/* a phone's status row has little room: a shorter bar keeps its figure on screen */for(const n of NICE)if(n*cssPerM<=room)best=n;scaleBar.style.width=Math.max(6,Math.round(best*cssPerM))+'px';scaleTxt.textContent=best>=1000?(best/1000)+' km':best+' m';
 /* on a narrow phone the row can still be too long: then the rain goes, whole, so a figure is never cut in half */
 if(PHONE()&&stClim.scrollWidth>stClim.clientWidth+1)stClim.textContent=tempTxt;
 /* say so once when a market fills up */
 const busy=['market','nightmarket'].filter(marketBusy).join(',');if(busy!==lastBusy){lastBusy=busy;if(busy){say(u.busy[busy.split(',')[0]]);}if(sel&&u.busyWhen[sel.id])renderCard();}}
monthEl.addEventListener('input',()=>setMonth(parseInt(monthEl.value,10)));
dayBtn.addEventListener('click',()=>{day=(day+1)%7;dayBtn.textContent=U().dayBtn+U().days[day];updateStatus();});
document.getElementById('labels').addEventListener('click',e=>{showLabels=!showLabels;e.currentTarget.setAttribute('aria-pressed',String(showLabels));});

document.getElementById('shops').addEventListener('click',e=>{showShops=!showShops;e.currentTarget.setAttribute('aria-pressed',String(showShops));if(showShops&&cam.z<11.5)say(U().shopsHint);});
weatherBtn.addEventListener('click',()=>{skyMode=(skyMode+1)%4;weatherBtn.textContent=U().sky[skyMode];});
document.getElementById('lang').addEventListener('click',()=>{lang=lang==='en'?'vi':'en';langSet=true;applyLang();saveState();});
document.getElementById('walk').addEventListener('click',()=>{if(sel){travel(sel);if(PHONE())openSheet(false);}else say(U().toast.pick);cv.focus();});
document.getElementById('me').addEventListener('click',()=>{follow=true;cam.x=hero.rx*T;cam.y=hero.ry*T;if(cam.z<5)cam.z=5;clampCam();cv.focus();});
document.getElementById('home').addEventListener('click',()=>{hero.path=[];pending=null;goal=null;hero.riding=null;rideSound(null);hero.x=START[0];hero.y=START[1];hero.rx=hero.x;hero.ry=hero.y;sel=null;follow=true;renderCard();say(U().toast.home);saveState();if(PHONE())openSheet(false);cv.focus();});
hourEl.addEventListener('input',()=>{hour=parseFloat(hourEl.value)%24;autoTime=false;document.getElementById('autoTime').setAttribute('aria-pressed','false');hourOut.textContent=U().hourFmt(Math.round(hour*2)/2);});
document.getElementById('autoTime').addEventListener('click',e=>{autoTime=!autoTime;e.currentTarget.setAttribute('aria-pressed',String(autoTime));});
document.getElementById('introBtn').addEventListener('click',()=>{document.getElementById('intro').hidden=true;try{localStorage.setItem('sapa-intro','1');}catch(e){}cv.focus();});
try{if(!localStorage.getItem('sapa-intro'))document.getElementById('intro').hidden=false;}catch(e){document.getElementById('intro').hidden=false;}

/* =====================================================================
   14. SOUND: river, wind, market chatter and birds mixed by where you
   stand, plus the rattle of the mountain train and the hum of the cable
   car while you ride them
   ===================================================================== */
let ac=null,mix=null,birdT=null;
function makeNoise(){const buf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const src=ac.createBufferSource();src.buffer=buf;src.loop=true;src.start();return src;}
function startSound(){if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();const master=ac.createGain();master.gain.value=0.9;master.connect(ac.destination);
 const chain=(type,freq,q,g0)=>{const src=makeNoise(),f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=ac.createGain();g.gain.value=g0;src.connect(f).connect(g).connect(master);return g;};
 const river=chain('lowpass',420,0.7,0),wind=chain('bandpass',260,0.6,0),chatter=chain('bandpass',1100,1.2,0),rattle=chain('bandpass',1500,2.5,0);
 const lfo=ac.createOscillator(),lfoG=ac.createGain();lfo.frequency.value=0.13;lfoG.gain.value=0.5;lfo.connect(lfoG).connect(wind.gain);lfo.start();
 /* cable car: a low two-note hum with a slow wobble */
 const hum=ac.createGain();hum.gain.value=0;hum.connect(master);for(const [f,type,g] of [[92,'sine',1],[184,'triangle',0.35],[276,'sine',0.12]]){const o=ac.createOscillator(),og=ac.createGain();o.type=type;o.frequency.value=f;og.gain.value=g;o.connect(og).connect(hum);o.start();}
 const wob=ac.createOscillator(),wobG=ac.createGain();wob.frequency.value=0.7;wobG.gain.value=0.02;wob.connect(wobG).connect(hum.gain);wob.start();
 mix={river,wind,chatter,rattle,hum,chatterLevel:0,forest:0,ride:null};
 setInterval(()=>{if(!soundOn||!mix)return;const t=ac.currentTime;mix.chatter.gain.linearRampToValueAtTime(mix.chatterLevel*(0.5+Math.random()),t+0.3);},350);
 /* mountain train: clack-clack over the rail joints, twice every beat */
 setInterval(()=>{if(!soundOn||!mix||mix.ride!=='train')return;const t=ac.currentTime,g=mix.rattle.gain;for(const d of [0,0.09]){g.setValueAtTime(0.0001,t+d);g.linearRampToValueAtTime(0.5,t+d+0.012);g.exponentialRampToValueAtTime(0.0001,t+d+0.07);}},260);}
 ac.resume();const chirp=()=>{if(!soundOn)return;if(mix.forest>0&&Math.random()<mix.forest){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';const f=2200+Math.random()*1500,t=ac.currentTime;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.4,t+0.08);o.frequency.exponentialRampToValueAtTime(f*0.9,t+0.18);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.07,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+0.22);}birdT=setTimeout(chirp,900+Math.random()*3000);};chirp();}
/* called when a ride starts ('train' or 'gondola') and when it ends (null) */
function rideSound(kind){if(!mix||!ac)return;mix.ride=soundOn?kind:null;const t=ac.currentTime;mix.hum.gain.cancelScheduledValues(t);mix.hum.gain.linearRampToValueAtTime(mix.ride==='gondola'?0.16:0,t+0.35);if(mix.ride!=='train'){mix.rattle.gain.cancelScheduledValues(t);mix.rattle.gain.linearRampToValueAtTime(0,t+0.1);}}
/* samples the land around you on a 77 m lattice, so distances read in the same units at any tile size */
function updateMix(){if(!soundOn||!mix)return;let dW=12,forest=0,n=0;for(let dy=-8;dy<=8;dy++)for(let dx=-8;dx<=8;dx++){const x=hero.x+dx*K,y=hero.y+dy*K;n++;if(x<0||y<0||x>=W||y>=H)continue;const k=kind[y*W+x];if(k===KI.water)dW=Math.min(dW,Math.hypot(dx,dy));if(k===KI.forest)forest++;}
 const e=eAt(hero.x,hero.y),td=townDist(hero.x,hero.y)/K,t=ac.currentTime,night=darkness(hour)>0.3,crowd=(marketBusy('market')||marketBusy('nightmarket'))?2:1;
 mix.river.gain.linearRampToValueAtTime(0.32*Math.max(0,1-dW/10),t+0.8);
 mix.wind.gain.linearRampToValueAtTime(e>2300?0.3:e>1900?0.14:0.03,t+0.8);
 mix.chatterLevel=(td<14&&!night?0.12*(1-td/14):td<14?0.04*(1-td/14):0)*crowd;
 mix.forest=night?0:Math.min(1,forest/n*2.2)*(skyNow()===3?0.2:1);}
soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.setAttribute('aria-pressed',String(soundOn));soundBtn.textContent=U().sound[soundOn?1:0];if(soundOn)try{startSound();updateMix();rideSound(hero.riding?hero.riding.sprite:null);}catch(e){soundOn=false;soundBtn.textContent=U().sound[0];}else{clearTimeout(birdT);rideSound(null);ac&&ac.suspend();}});
setInterval(updateMix,1000);

/* =====================================================================
   15. INPUT: click to walk, drag, wheel, pinch, overview, hover tooltips
   ===================================================================== */
/* the walker only goes where you click or tap. On a keyboard the arrow keys move the view, a cross marks its middle
   and Enter walks there, which is the keyboard's click. */
const PAN={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
cv.addEventListener('keydown',e=>{const d=PAN[e.key];
 if(d){e.preventDefault();follow=false;kbAim=true;cam.x+=d[0]*viewW()/8;cam.y+=d[1]*viewH()/8;clampCam();}
 else if((e.key==='Enter'||e.key===' ')&&kbAim){e.preventDefault();const x=cam.x/T,y=cam.y/T,l=overL(x,y);if(l)travel(l);else walkTo(Math.floor(x),Math.floor(y));}
 if(e.key==='+'||e.key==='=')zoom(1);if(e.key==='-')zoom(-1);});
const ZL=[1,1.8,3,5,8,12,16];
function zoomTo(z,px,py){z=Math.max(1,Math.min(ZMAX,z));if(px!==undefined){const [wx,wy]=world(px,py);cam.z=z;const s=fitScale*cam.z;cam.x=wx-(px-cv.width/2)/s;cam.y=wy-(py-cv.height/2)/s;}else cam.z=z;clampCam();saveState();}
function zoom(dir,px,py){let i=0;for(let k=0;k<ZL.length;k++)if(ZL[k]<=cam.z+0.01)i=k;i=Math.max(0,Math.min(ZL.length-1,i+dir));zoomTo(ZL[i],px,py);}
document.getElementById('zin').addEventListener('click',()=>{zoom(1);cv.focus();});
document.getElementById('zout').addEventListener('click',()=>{zoom(-1);cv.focus();});
document.getElementById('zfit').addEventListener('click',()=>{cam.z=1;follow=false;clampCam();cv.focus();});
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect(),k=cv.width/r.width;zoom(e.deltaY<0?1:-1,(e.clientX-r.left)*k,(e.clientY-r.top)*k);follow=false;},{passive:false});
function tileFromEvent(e){const r=cv.getBoundingClientRect(),k=cv.width/r.width;const [wx,wy]=world((e.clientX-r.left)*k,(e.clientY-r.top)*k);return[wx/T,wy/T];}
/* small places need a generous finger-sized target: at least one tile of margin around the sprite */
const overL=(x,y)=>{const m=Math.max(0.6,5/pxPerTile());return LM.find(l=>x>=l.x-m&&x<l.x+l.w+m&&y>=l.y-m&&y<l.y+l.w+m)||null;};
const overS=(x,y)=>{const m=Math.max(0.7,5/pxPerTile());let best=null,bd=m;for(const h of STAYS){const d=Math.hypot(h.x-x,h.y-y);if(d<bd){bd=d;best=h;}}return best;};
const stayTip=h=>'<b>'+h.n+'</b> · '+U().stay;
const overF=(x,y)=>{const m=Math.max(1.2,6/pxPerTile());let best=null,bd=m;for(const f of FEAT){const d=Math.hypot(f.x-x,f.y-y);if(d<bd){bd=d;best=f;}}return best;};
const ptrs=new Map();let drag=null,pinch=null,lastTap=null;
cv.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;kbAim=false;cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);if(PHONE())openSheet(false);
 if(ptrs.size===2){const [p1,p2]=[...ptrs.values()];pinch={d0:Math.hypot(p1[0]-p2[0],p1[1]-p2[1]),z0:cam.z};drag=null;}
 else drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false};});
function showTip(e,html){tipEl.innerHTML=html;tipEl.style.display='block';const r=cv.getBoundingClientRect();tipEl.style.left=Math.max(4,Math.min(r.width-230,e.clientX-r.left+14))+'px';tipEl.style.top=(e.clientY-r.top+14)+'px';}
const featTip=f=>{const nm=lang==='vi'?f.n:(f.ne||f.n);return'<b>'+(nm||U().feat[f.k])+'</b>'+(nm?' · '+U().feat[f.k]:'')+'<br>'+f.e.toLocaleString('en')+' m';};
cv.addEventListener('pointermove',e=>{if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,[e.clientX,e.clientY]);
 if(pinch&&ptrs.size===2){const [p1,p2]=[...ptrs.values()];const d=Math.hypot(p1[0]-p2[0],p1[1]-p2[1]);const r=cv.getBoundingClientRect(),k=cv.width/r.width;const mx=((p1[0]+p2[0])/2-r.left)*k,my=((p1[1]+p2[1])/2-r.top)*k;zoomTo(pinch.z0*d/pinch.d0,mx,my);follow=false;return;}
 const [x,y]=tileFromEvent(e);hover=overL(x,y);
 if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>4){drag.moved=true;cv.classList.add('drag');follow=false;const k=cv.width/cv.getBoundingClientRect().width/(fitScale*cam.z);cam.x=drag.cx-dx*k;cam.y=drag.cy-dy*k;clampCam();}tipEl.style.display='none';}
 else{const xi=Math.floor(x),yi=Math.floor(y),ps=poiAt.get(yi*W+xi),hs=hover?null:overS(x,y),f=hover||hs?null:overF(x,y);cv.style.cursor=hover||ps||f||hs?'pointer':'grab';
  if(hover)showTip(e,'<b>'+nameOf(hover)+'</b><br>'+elevOf(hover)+' m');
  else if(hs&&pxPerTile()>=5)showTip(e,stayTip(hs));
  else if(f&&pxPerTile()>=5)showTip(e,featTip(f));
  else if(ps&&pxPerTile()>=5)showTip(e,ps.slice(0,4).map(p=>'<b>'+(p.n||U().poi[p.k])+'</b> · '+U().poi[p.k]+(p.s&&p.s!=='yes'?' ('+p.s+')':'')).join('<br>'));
  else if(pxPerTile()>=5&&xi>=0&&yi>=0&&xi<W&&yi<H)showTip(e,Math.round(eAt(xi,yi))+' m');else tipEl.style.display='none';}});
function endPtr(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;}
cv.addEventListener('pointerup',e=>{const was=drag;endPtr(e);drag=null;cv.classList.remove('drag');if(!was||was.moved)return;const [x,y]=tileFromEvent(e);cv.focus();
 /* a second tap in the same spot zooms in there, and calls off the walk the first tap started */
 if(e.pointerType==='touch'){const now=performance.now();if(lastTap&&now-lastTap.t<320&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<30){lastTap=null;if(!hero.riding){hero.path=[];pending=null;goal=null;}const r=cv.getBoundingClientRect(),k=cv.width/r.width;zoom(1,(e.clientX-r.left)*k,(e.clientY-r.top)*k);follow=false;tipEl.style.display='none';return;}lastTap={t:now,x:e.clientX,y:e.clientY};}
 const l=overL(x,y);if(l){travel(l);return;}
 /* a tap on a homestay, waterfall, viewpoint or peak just says what it is */
 if(e.pointerType!=='mouse'){const hs=overS(x,y);if(hs){showTip(e,stayTip(hs));return;}const f=overF(x,y);if(f){showTip(e,featTip(f));return;}}
 walkTo(Math.floor(x),Math.floor(y));});
cv.addEventListener('pointercancel',e=>{endPtr(e);drag=null;cv.classList.remove('drag');});
cv.addEventListener('pointerleave',()=>{hover=null;tipEl.style.display='none';});
mini.addEventListener('click',e=>{const r=mini.getBoundingClientRect();cam.x=(e.clientX-r.left)/r.width*W*T;cam.y=(e.clientY-r.top)/r.height*H*T;follow=false;clampCam();if(PHONE())openSheet(false);cv.focus();});
/* any input wakes the loop to full frame rate for a moment */
const poke=()=>{lastInput=performance.now();};['pointerdown','pointermove','wheel','keydown','touchstart','click'].forEach(ev=>window.addEventListener(ev,poke,{passive:true}));

/* =====================================================================
   16. BOOT AND MAIN LOOP
   Frame pacing saves battery: full rate while you walk, ride, pan or
   zoom; about 8 frames a second when the scene is only idling; nothing
   at all while the tab is hidden.
   ===================================================================== */
let last=0,acc=0,skyAcc=0;
function loop(ts){requestAnimationFrame(loop);
 if(typeof document!=='undefined'&&document.hidden){last=ts;return;}
 const active=hero.moving||hero.path.length>0||hero.riding||drag||pinch||ts-lastInput<900;
 const raw=ts-last;if(!active&&raw<120)return;
 const dt=Math.min(active?50:160,raw||16);last=ts;acc+=dt;if(acc>100){acc=0;frame++;}gond=(gond+dt/50)%600;
 if(autoTime){const nh=hour+dt/7500;if(nh>=24){day=(day+1)%7;dayBtn.textContent=U().dayBtn+U().days[day];}hour=nh%24;hourEl.value=hour;hourOut.textContent=U().hourFmt(Math.round(hour*2)/2);}
 autoSkyT+=dt;if(autoSkyT>180000){autoSkyT=0;pickAutoSky();}
 for(const c of clouds){c.x+=c.v*dt/16;if(c.x>W*T+c.r)c.x=-c.r;}
 tick(dt);tickAmb(dt);tickShoppers(dt);render();
 statusAcc+=dt;if(statusAcc>250){statusAcc=0;updateStatus();}
 skyAcc+=dt;if(skyAcc>400||skyDirty||lastSkyCol!==hero.y*W+hero.x){skyAcc=0;skyDirty=false;lastSkyCol=hero.y*W+hero.x;renderSky();}}
tickAmb(0);applyLang();loadingEl.hidden=true;
/* pixel icons for the two map buttons that had no glyph in the pixel font */
const pixIcon=rows=>'<svg viewBox="0 0 8 8" width="16" height="16" shape-rendering="crispEdges" aria-hidden="true">'+rows.map((r,y)=>[...r].map((ch,x)=>ch==='X'?'<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="currentColor"/>':'').join('')).join('')+'</svg>';
document.getElementById('me').innerHTML=pixIcon(['...XX...','...XX...','........','XX.XX.XX','XX.XX.XX','........','...XX...','...XX...']);
document.getElementById('gear').innerHTML=pixIcon(['.X.XX.X.','XXXXXXXX','.XX..XX.','XX....XX','XX....XX','.XX..XX.','XXXXXXXX','.X.XX.X.']);
/* finish applying an address view */
hourEl.value=hour;hourOut.textContent=U().hourFmt(Math.round(hour*2)/2);document.getElementById('autoTime').setAttribute('aria-pressed',String(autoTime));
if(HASH.sel&&byId(HASH.sel)){sel=byId(HASH.sel);renderCard();}
if(HASH.tab&&TABS.includes(HASH.tab)){showTab(HASH.tab);if(PHONE())openSheet(true);}
if(Object.keys(HASH).some(k=>k!=='worker'))document.getElementById('intro').hidden=true;
document.fonts&&document.fonts.load('9px "Press Start 2P"').then(()=>{skyDirty=true;}).catch(()=>{});
booted=true;requestAnimationFrame(loop);
globalThis.__T={walkTo,nearestOpen,reach,dryAt,STAYS,wMask,flags,stalls,FEST,damAt,POWER,get goal(){return goal;},findPath,LM,KINDS,kind,at,passable,hero,W,H,K,nearTarget,STREET_LABELS,TREKS,FEAT,WAYS,townDist,TOWN_R,estimate,walkCost,poiAt,fogLevel,TRAIN_LINE,CABLE_LINE,marketBusy,travel,tick,amb,shoppers,crews,routeInfo,elev};
})();
